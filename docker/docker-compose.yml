# Local / self-hosted deployment of the full DataSentinel stack: PostgreSQL,
# the FastAPI backend, and the static frontend bundle. See docker/README.md
# for usage. Not a production-hardening guide — see ../SECURITY.md for that.
#
# Variables are read from a `.env` file in this directory (copy
# docker/.env.example -> docker/.env and fill in real values first).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datasentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datasentinel}
      POSTGRES_DB: ${POSTGRES_DB:-datasentinel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datasentinel} -d ${POSTGRES_DB:-datasentinel}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  # One-shot migration step: `alembic upgrade head` against the compose
  # postgres service, run to completion before the backend API starts.
  # Deliberately not baked into the backend image's own startup (see the
  # rationale in backend.Dockerfile / backend/datasentinel_backend/main.py).
  backend-migrate:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
