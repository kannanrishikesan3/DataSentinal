[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datasentinel-agent"
version = "0.1.0"
description = "DataSentinel endpoint agent — filesystem discovery, PII/secret detection, local risk scoring"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # Core
    "psutil>=5.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "click>=8.1",
    "httpx>=0.27",
    "tenacity>=8.2",

    # Document parsing
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "python-magic>=0.4.27; platform_system != 'Windows'",
    "python-magic-bin>=0.4.14; platform_system == 'Windows'",
    "defusedxml>=0.7.1",

    # PII detection
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",

    # Windows service support (installed only on Windows)
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyinstaller>=6.5",
]

[project.scripts]
datasentinel = "datasentinel_agent.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["datasentinel_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
