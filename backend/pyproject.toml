[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datasentinel-backend"
version = "0.1.0"
description = "DataSentinel central server — endpoint registration, scan/finding ingestion, dashboard APIs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.4's bcrypt self-test crashes under bcrypt>=4.1 (which
    # removed silent >72-byte truncation in favor of raising). Pin until
    # passlib cuts a release with the fix.
    "bcrypt==4.0.1",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["datasentinel_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
